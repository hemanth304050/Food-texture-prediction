{% extends 'layout.html' %}

{% block extra_style %}
<style>
    .form-group {
        margin-bottom: 1.5rem;
    }

    label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
        font-weight: 500;
    }

    input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        transition: border-color 0.3s;
    }

    input:focus {
        outline: none;
        border-color: var(--primary);
    }

    .result-card.Good {
        background: rgba(34, 197, 94, 0.1);
        border-color: var(--success);
    }

    .result-card.Bad {
        background: rgba(245, 158, 11, 0.1);
        border-color: #f59e0b;
    }

    .result-card.Worst {
        background: rgba(239, 68, 68, 0.1);
        border-color: var(--error);
    }

    .result-value {
        font-size: 2.5rem;
        font-weight: 800;
        margin-top: 0.5rem;
    }

    .result-value.Good {
        color: var(--success);
    }

    .result-value.Bad {
        color: #f59e0b;
    }

    .result-value.Worst {
        color: var(--error);
    }
</style>
{% endblock %}

{% block content %}
<div class="glass-card" style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-bottom: 2rem;">Texture Prediction</h2>
    <form action="/predict" method="POST">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
            <div class="form-group">
                <label for="force">Force Data (N)</label>
                <input type="number" step="0.01" name="force" id="force" required
                    value="{{ inputs.force if inputs else '' }}">
            </div>
            <div class="form-group">
                <label for="vib_freq">Vibration Frequency (Hz)</label>
                <input type="number" step="0.01" name="vib_freq" id="vib_freq" required
                    value="{{ inputs.vib_freq if inputs else '' }}">
            </div>
            <div class="form-group">
                <label for="vib_amp">Vibration Amplitude (mm)</label>
                <input type="number" step="0.01" name="vib_amp" id="vib_amp" required
                    value="{{ inputs.vib_amp if inputs else '' }}">
            </div>
            <div class="form-group">
                <label for="sound_int">Sound Pressure Intensity (dB)</label>
                <input type="number" step="0.01" name="sound_int" id="sound_int" required
                    value="{{ inputs.sound_int if inputs else '' }}">
            </div>
            <div class="form-group">
                <label for="sound_freq">Sound Frequency (kHz)</label>
                <input type="number" step="0.01" name="sound_freq" id="sound_freq" required
                    value="{{ inputs.sound_freq if inputs else '' }}">
            </div>
            <div class="form-group">
                <label for="moisture">Moisture Rate (%)</label>
                <input type="number" step="0.01" name="moisture" id="moisture" required
                    value="{{ inputs.moisture if inputs else '' }}">
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Predict Texture</button>
    </form>

    {% if result %}
    <div class="result-card {{ result }} animate-fade-in">
        <p style="text-transform: uppercase; letter-spacing: 2px; font-weight: 600; color: var(--text-muted);">
            Prediction Result</p>
        <div class="result-value {{ result }}">{{ result }}</div>
    </div>
    {% endif %}

    {% if error %}
    <div
        style="margin-top: 2rem; padding: 1rem; border-radius: 12px; background: rgba(239, 68, 68, 0.1); border: 1px solid var(--error); color: var(--error); text-align: center;">
        {{ error }}
    </div>
    {% endif %}
</div>
{% endblock %}
